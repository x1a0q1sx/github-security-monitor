# GitHub search queries used by keyword source (batched).
# Prefer precise phrases; A-tier single tokens are searched with security qualifier.
search_queries:
  S:
    - '"cobalt strike" OR cobaltstrike OR "malleable c2" OR "aggressor script"'
    - '"sliver c2" OR "mythic c2" OR "havoc c2" OR "covenant c2" OR meterpreter'
    - '"process hollowing" OR "reflective dll" OR "direct syscall" OR "ntdll unhook"'
    - '"amsi bypass" OR "edr bypass" OR "etw bypass" OR "shellcode loader"'
    - '"godzilla webshell" OR "quasar rat" OR "async rat" OR poshc2 OR silenttrinity'
    - 'shadowpad OR plugx OR "fileless execution" OR "in-memory execution"'
  A:
    - 'shellcode (bypass OR loader OR injection OR encryption OR evasion)'
    - 'webshell (godzilla OR behinder OR antsword OR manage)'
    - '"red team" OR redteam (tool OR framework OR c2 OR arsenal)'
    - '0day (exploit OR poc OR vulnerability)'
  B:
    - '"sql injection" OR ssrf OR xxe (tool OR scanner OR payload)'
    - '"malware analysis" OR "threat hunting" OR "incident response" stars:>5'
