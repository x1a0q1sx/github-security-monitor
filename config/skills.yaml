  # they false-hit "pattern"/"pentest"/"success".
  security: [security, pentest, cve, vulnerability, exploit, malware, threat, appsec, osint, forensics, red team, blue team]
  design: [ui, ux, design, frontend, css, tailwind, typography]
  devops: [deploy, docker, kubernetes, terraform, ansible, ci/cd, github actions]
  testing: [unit test, e2e, playwright, jest, pytest, quality assurance]
  productivity: [productivity, workflow, notes, todo, task management]
  documentation: [documentation, readme, changelog, technical writing]
  git: [git, pull request, commit, branch, merge conflict]
