  - owner: gentilkiwi
    repo: mimikatz
  - owner: ehang-io
    repo: nps
  - owner: chaitin
    repo: xray
  - owner: shadow1ng
    repo: fscan

trending:
  min_stars: 50
  top_n: 30
  queries:
    - "topic:security stars:>50"
    - "redteam stars:>50"
    - "offensive-security stars:>30"
    - "penetration-testing stars:>50"
    - "malware-analysis stars:>30"
    - "reverse-engineering stars:>30"
    - "threat-hunting stars:>30"
    - "cobalt-strike stars:>30"
    - "vulnerability exploit stars:>50"
    - "bug-bounty stars:>50"

skills:
  enable: true
  min_final_score: 5.0
  max_items: 80
  prefer_security_weight: 1.35
  sources:
    skillhub: true
    github: true
    seed: true
  skillhub:
    base_url: "https://lightmake.site"
    queries:
      - security
      - pentest
      - code review
      - cve
      - devops
      - git
      - ui ux
      - testing
      - documentation
      - productivity
    limit_per_query: 10
  github:
    queries:
      - "SKILL.md path:/ filename:SKILL.md"
      - "ai-skills in:topics"
      - "claude skill in:readme stars:>5"
    per_page: 20
  installed_slugs: []  # optional suppress list
