# GitHub Security Monitor V5 — main config
# Secrets via env: GITHUB_TOKEN / GH_TOKEN, DINGDING_WEBHOOK, DINGDING_SECRET, FEISHU_WEBHOOK

version: 5

github:
  token: ""  # env GITHUB_TOKEN or GH_TOKEN
  request_timeout: 20
  min_request_interval_ms: 350
  # Search API is a separate budget (~30/min with token, ~10/min anonymous).
  # 2200ms ≈ 27 search calls/min, safely under authenticated limit.
  search_min_interval_ms: 2200
  search_page_size: 30
  max_retries: 3

monitor:
  # Slightly relaxed vs first V5 cut: catch near-miss S/A hits without reopening
  # pure-noise flood. S keywords are searched one-by-one (not OR-batched).
  min_final_score: 5.5
  min_stars: 0
  allow_zero_stars_if_precise: true
  skip_forks: true
  skip_empty_description: false  # soft: quality penalty; hard-drop only when also low score
  skip_no_info: true             # drop empty desc + 0 stars + no language (CVE exempt in source)
  max_per_author_per_run: 3
  keyword_window_days: 3
  cve_window_days: 2
  user_window_days: 7
  records_soft_limit: 8000
  translate: true                # 英文描述 -> 中文 description_cn
  translate_sleep_ms: 50         # 每条翻译间隔，避免打爆免费接口

notify:
  dingding:
    enable: true
    webhook: ""
    secret: ""
  feishu:
    enable: false
    webhook: ""
  min_notify_score: 7.0
  max_items_per_message: 20

black_users:
  - AlAIAL90
  - algotables

users:
  - yhy0
  - su18
  - BeichenDream
  - phith0n
  - zhzyker
  - lijiejie
  - projectdiscovery

tools:
  - owner: BeichenDream
    repo: Godzilla
  - owner: rebeyond
    repo: Behinder
  - owner: AntSwordProject
