name: Weekly Trending Monitor

on:
  schedule:
    # 每周一 01:00 UTC (北京时间周一 09:00)
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run Weekly Trending
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        run: python monitor/run.py --trending
      - name: Commit & Push Data
        run: |
          cp data/*.json docs/data/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          git diff --staged --quiet || git commit -m "[bot] weekly trending $(date -u +%Y-%m-%dT%H:%M)"
          git push
