name: GitHub Security Monitor

on:
  schedule:
    # 每天 4 次 UTC (北京时间 10:00, 16:00, 22:00, 凌晨 04:00)
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        type: choice
        options: [daily, trending, skills, all, migrate]
        default: daily

permissions:
  contents: write

# Serialize all data-writing jobs so concurrent bot commits don't reject each other
concurrency:
  group: gsm-data-update
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Migrate historical scores
        if: github.event.inputs.mode == 'migrate'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python -m monitor.run --migrate-only --publish

      - name: Daily Monitor
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'daily' || github.event.inputs.mode == 'all'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          DINGDING_SECRET: ${{ secrets.DINGDING_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python -m monitor.run --daily --publish

      - name: Trending Monitor
        if: github.event.inputs.mode == 'trending' || github.event.inputs.mode == 'all'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python -m monitor.run --trending --publish

      - name: Skills Discovery
        if: github.event.inputs.mode == 'skills' || github.event.inputs.mode == 'all'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          DINGDING_SECRET: ${{ secrets.DINGDING_SECRET }}
        run: python -m monitor.run --skills --publish

      - name: Commit & Push Data
        run: |
          set -euo pipefail
          mkdir -p docs/data
          cp -f data/*.json docs/data/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/ || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "[bot] monitor v5 $(date -u +%Y-%m-%dT%H:%M)"

          # Rebase onto latest main and push with retries (belt-and-suspenders
          # with concurrency group, in case another writer still sneaks in).
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed on attempt ${i}"
              exit 0
            fi
            echo "Push attempt ${i} failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          echo "Failed to push after retries"
          exit 1
