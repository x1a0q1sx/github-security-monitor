name: Skills Discovery

on:
  schedule:
    # 每天 2 次 UTC (北京时间 11:00 / 23:00)
    - cron: '0 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Discover Skills
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          DINGDING_SECRET: ${{ secrets.DINGDING_SECRET }}
        run: python -m monitor.run --skills --publish
      - name: Commit & Push Data
        run: |
          mkdir -p docs/data
          cp -f data/*.json docs/data/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          git diff --staged --quiet || git commit -m "[bot] skills $(date -u +%Y-%m-%dT%H:%M)"
          git push
